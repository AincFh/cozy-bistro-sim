name: Cozy Bistro · Test & Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cozy-bistro-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulation tests
        run: npm test
      - name: Validate browser scripts
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser QA
        run: |
          python -m pip install selenium==4.37.0
          sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-microhei
      - name: Check catering game UI in Chrome desktop and mobile
        run: python tests/browser_catering.py
      - name: Preserve catering test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozy-bistro-catering-chrome
          path: test-artifacts/contracts/
          if-no-files-found: ignore
      - name: Check shipped game files
        run: test -s index.html && test -s style.css && test -s src/app.js && test -s src/engine.js && test -s src/scene.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4